# Frozen scoring configuration — ProteinMPNN conditional sequon score
#
# Written before any labelled contrast was computed. Nothing here may be changed
# after the occupied-versus-control differences have been seen; a later change is
# a new analysis, recorded as such, not an edit to this one.

[provenance]
frozen_on = "2026-08-17"
frozen_before = "any occupied-versus-control contrast was calculated"
preflight_gates = "all four passed: control labels, eukaryotic taxonomy, exact three-residue mapping, one score per unique site"
manifest = "results/scoring_manifest.csv"
manifest_rows = 2910
unique_scoreable_sites = 2640

[model]
name = "ProteinMPNN"
checkpoint = "v_48_020"
source = "ProteinMPNN/vanilla_model_weights/v_48_020.pt"
rationale = "the checkpoint used by the earlier scoping analysis (a quick baseline run over a handful of proteins, not a published preprint), so conditional scores and the design-retention analysis describe the same model"
k_neighbors = 48
augment_eps = 0.0
augment_eps_note = "backbone noise disabled at inference; the checkpoint's 0.2 training noise is a property of the weights, not something to reapply"
device = "cpu"
threads = 1
threads_note = "OMP_NUM_THREADS=1 with KMP_DUPLICATE_LIB_OK for the duplicate libomp on macOS; single-threaded also makes the numbers reproducible"

[conditioning]
mode = "conditional"
definition = "P(amino acid at position | backbone and the rest of the native sequence)"
call = "ProteinMPNN.conditional_probs"
backbone_only = false
sequences_generated = false
sequon_altered = false
whole_protein_score_used = false
whole_protein_note = "three residues contribute almost nothing to an average over hundreds, so a protein-level score cannot answer a site-level question"

[decoding_orders]
n_orders = 8
seed = 0
generator = "torch.Generator(device='cpu').manual_seed(seed), one randn draw per order"
retain_per_order = true
rationale = "conditional probabilities depend on the sampled decoding order; measured SD across orders was 0.080 on a real site, so a single order is one draw reported as a value"
convergence_rule = "adopt 8 only if 8-vs-16 median difference < 0.02 SD, 95th percentile < 0.05 SD and correlation > 0.99 on a blinded ~50-site subset; otherwise use 16"
convergence_result = "PASSED on 50 blinded sites (seed 20260817): median 0.0022 SD, p95 0.0141 SD, correlation 0.99998 -> 8 orders adopted"
convergence_artefacts = ["results/convergence_check.csv", "results/convergence_check.json"]

[optimisation]
restrict_positions = true
restrict_positions_note = """
ProteinMPNN's conditional_probs runs a full decoder pass for every position it is
asked about, so a 300-residue chain costs 300 passes to answer about three. The
per-position result depends only on that position and the decoding order, so the
request is restricted to the sequon residues. Verified bit-identical against the
unrestricted computation (max difference 0.0, score equal to nine decimals) and
49x faster.
"""
batch_by_structure_chain = true
batch_note = "sites sharing a chain reuse one probability computation; 2,640 sites reduce to 1,725 chain groups"

[score]
primary = "conditional_sequon_score"
formula = "mean( logit P(N) at the first position, logit[ P(S) + P(T) ] at the third )"
logit = "log(p / (1 - p))"
epsilon = 1e-6
epsilon_note = "probabilities clamped before the logit so a saturated position gives a large finite value rather than an infinity"
middle_residue_excluded = true
middle_residue_note = "any residue except proline permits a sequon, so a preference at +1 is not a preference for the motif; P(proline) is recorded as a diagnostic"
also_recorded = [
    "p_asn_at_n", "p_ser_at_plus2", "p_thr_at_plus2", "p_ser_or_thr_at_plus2",
    "p_pro_at_plus1", "full 21-residue probability vectors at all three positions",
]

[equivalence]
margin_standardised = 0.2
margin_sign = "two-sided, plus or minus"
status = "exploratory statistical threshold, NOT a biologically validated one"
reference_sd_rule = """
Estimated per model and per conditioning mode, as the standard deviation of the
primary score across all unique structurally scoreable dataset sites — the 332
occupied and 32 observed-unmodified — pooled and computed WITHOUT reference to
their labels. The raw margin is 0.2 times that reference SD.
"""
reference_sd_population = "364 unique dataset sites (332 occupied + 32 observed-unmodified)"
applies_to = "the primary conditional-score analysis only"
same_scale_across = ["vs_observed_unmodified", "vs_bacterial_control", "vs_cytosolic_control"]
report_unstandardised = true
report_unstandardised_note = "the raw log-odds difference and its confidence interval are reported alongside the standardised effect"
secondary_outcomes = "retention and other secondary outcomes are descriptive until they have their own justified margins"
inconclusive_rule = """
If the 24-pair confidence interval is too wide to establish equivalence, the
result is reported as inconclusive. A non-significant difference at this sample
size is not evidence of no effect.
"""

[analysis_unit]
unit = "one occupied site"
contrast = "site_contrast = occupied_score - mean(scores of its matched controls)"
not_the_unit = "individual rows of a 1:k matched set are not independent observations"
uncertainty = "resample whole proteins or ortholog clusters; control proteins contributing several sites handled by clustered resampling"
stratify = "NXS versus NXT exactly or by stratum; middle X residue distribution reported"

# ============================================================================
# AMENDMENT 1 — 2026-08-18
#
# A defect was found in the scorer after the first set of contrasts had been
# computed and seen. Everything below records what changed and why. The
# scientific choices above are unchanged: the model, the conditioning, the
# score formula, the 0.2 SD margin and the analysis unit all stand exactly as
# frozen. What changed is that invalid rows are now excluded, which moves the
# numbers those rules are applied to.
#
# This section exists so the change is visible as a correction rather than an
# edit. The first result cannot be treated as an independent prior estimate:
# it was computed from the same data with a broken scorer.
# ============================================================================

[amendment_1]
date = "2026-08-18"
reason = "defect correction, not a change of analytical choice"

[amendment_1.defect]
what = """
ProteinMPNN's conditional_probs allocates a zero tensor of log-probabilities
and fills only positions surviving chain_M * mask, where mask is zero wherever
the backbone is incomplete. A residue missing N, CA, C or O was returned as a
row of zeros. Exponentiating gives twenty-one ones: P(N) = 1, P(S)+P(T) = 2,
and a conditional_sequon_score of about +13.8.
"""
why_it_was_missed = """
The manifest confirmed that all three sequon residues had coordinates and a
model index. That is a different claim from ProteinMPNN having accepted them,
and nothing checked that the returned vectors were distributions.
"""
scope = "105 of 2,564 scored sites, 8 of them dataset sites (5 occupied, 3 internal control)"
effect_on_reference_sd = "inflated it from 1.3316 to 2.6169, so every standardised effect was wrong"
found_by = "external review of the scoring code and output rows"

[amendment_1.fix]
guards = [
    "conditional_probabilities returns the set of positions the model actually decoded",
    "sequon_score rejects any undecoded position",
    "sequon_score rejects any row that does not sum to 1 within 1e-3 or leaves [0,1]",
]
independence = "the two guards are independent; neither is a single point of failure"
regression_test = "tests/fixtures/incomplete_backbone.pdb — real backbone geometry with one sequon +2 oxygen removed, which reproduces the all-ones row end to end"

[amendment_1.ordering]
change = "scoreability is now established before matching, not after"
rationale = """
Scoreability is a property of the coordinates, so it can be settled without a
model pass. Establishing it afterwards let unscoreable sites into matched sets
and removed them later, unbalancing sets that matching had just balanced.
"""
validation = "the pre-screen reproduced all 103 in-manifest corrupted rows with zero false positives and zero misses"

[amendment_1.matching]
exact_subtype = true
exact_subtype_rationale = """
About 45% of analysable pairs previously matched an NXS site to an NXT control.
NXT is occupied more often and the two are chemically distinct, so subtype was
confounded with occupancy. It is now matched exactly.
"""
k = 1
k_was = 5
k_rationale = """
28 internal controls against 314 occupied sites. Greedy matching without
replacement at k=5 lets the first cases absorb the pool, yielding 14 occupied
cases from 314. At k=1 each control supports a distinct occupied case, which is
what the analysis unit counts. k=5 is retained as a sensitivity analysis.
"""
k_disclosure = """
Pre-specified before any score existed under the corrected scorer, but NOT
blind: the defective run's primary estimate had already been seen. Recorded as
a deviation for that reason.
"""
features_unchanged = ["rsa", "n_neighbours_8a", "hydrophobic_fraction_8a"]
caliper_unchanged = 0.25

[amendment_1.uncertainty]
change = "resampling unit is now the connected component of occupied ortholog clusters and the control proteins they share"
was = "the occupied site's ortholog cluster only"
rationale = """
The [analysis_unit] rule above already promised that control proteins
contributing several sites would be handled by clustered resampling. The
implementation did not do it. Two dependencies run through the contrasts —
near-identical occupied orthologs, and one control protein matched to several
occupied cases — and resampling on either alone leaves the other unaccounted
for.
"""

[amendment_1.terminology]
change = "the 32-site class is described as 'no modelled glycan under internal-control conditions'"
was = "observed-unmodified"
rationale = """
These sites are not demonstrated to be chemically unmodified. They are sequons
with no modelled glycan in structures where a glycan would have been visible
had it been present. That makes them the best available internal controls and
not definitive biochemical negatives, and the earlier name claimed the latter.
The stored class value remains observed_unmodified as a legacy identifier.
"""

[amendment_1.reference_sd]
recomputed = 1.3316
was = 2.6169
population = "342 scoreable dataset sites (314 occupied + 28 internal control), labels not consulted"
population_was = "364 sites including 8 that could not be validly scored"
margin_raw = 0.2663
note = "the rule is unchanged; only the set it is applied to is corrected"

# ============================================================================
# AMENDMENT 2 — 2026-08-18
#
# Recorded as an amendment because corrected scores had already been inspected
# when this change was made. It alters no scientific choice: the model, the
# score, the margin, the features, the caliper and the exact-subtype
# requirement are all unchanged. What changes is the algorithm that assigns
# pairs, from a seeded heuristic to a deterministic optimum.
# ============================================================================

[amendment_2]
date = "2026-08-18"
reason = "remove an arbitrary dependence on matching order; corrected scores already seen"

[amendment_2.problem]
what = """
Greedy nearest-neighbour matching walks the cases in a seeded random order and
takes the nearest available control each time. With 28 controls for 314
occupied sites that order is consequential: an early case can take the only
admissible partner for a later one, so which pairs form depends on the seed.
The reported seed-0 result was one draw from that distribution presented as a
value.
"""

[amendment_2.change]
algorithm = "maximum-cardinality, minimum-total-distance assignment"
implementation = "scipy.optimize.linear_sum_assignment with ineligible pairings priced above any achievable total of admissible distances"
deterministic = true
seed = "none — there is no ordering and no random draw"
unchanged = ["rsa", "n_neighbours_8a", "hydrophobic_fraction_8a", "caliper 0.25", "exact NXS/NXT", "1:1 without replacement"]
tested = "greedy can tie the optimal pair count over 40 seeds but never exceed it; output is invariant to input row order"

[amendment_2.result]
pairs = 16
mean_raw = 0.6104
mean_sd = 0.458
ci95_sd = [-0.227, 1.098]
verdict = "inconclusive"
mean_matching_distance = 0.0990
mean_matching_distance_greedy_seed0 = 0.1125

[amendment_2.sensitivity]
greedy_seed0 = "mean +0.649 SD, 95% CI [+0.075, +1.243], directional/magnitude undetermined"
greedy_200_seeds = """
Pair count is 16 under every seed, so the caliper rather than the algorithm
limits it: 12 of the 28 controls have no admissible partner within 0.25.
Mean contrast ranges +0.286 to +0.699 SD. EVERY point estimate is positive.
The interval excludes zero in 75 of 200 seeds (38%).
"""
conclusion = """
Whether the confidence interval excludes zero depends on which matching is
selected. The direction does not. This is why the deterministic matching is
primary: it removes the choice rather than making it favourably.
"""

[amendment_2.headline]
text = """
Occupied sites tend to score higher than matched sites with no modelled glycan,
but 16 pairs do not establish a precise or statistically robust difference.
"""
supersedes = "the earlier reading that the corrected interval excluded zero"

[amendment_2.housekeeping]
primary_analysis_loads = "only the data the requested comparison needs; the control pool is read for diagnostics alone"
reference_population = "reported from the dataset sites alone, so the scale cannot move when a control pool is rebuilt"
shared_code = "contrast construction, resampling unit and bootstrap extracted to experimental_glycosylation_sites.contrasts, used by both the primary analysis and the sensitivity sweep"
removed_runner = "runners/score_unmatched.py — superseded by build_candidate_manifest.py plus score_all.py; it depended on a file in /tmp and could not be reproduced"

[amendment_2.status]
proteinmpnn_analysis = "frozen"
next = "no further models, endpoints or mechanistic analyses on this pass"
